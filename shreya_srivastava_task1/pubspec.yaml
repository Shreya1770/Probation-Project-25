name: shopping_app
description: A Flutter shopping app demo with provider and splash screen.

publish_to: 'none' # Remove this line if you want to publish to pub.dev

environment:
  sdk: ">=2.18.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.0.5

  # Add other dependencies here if needed

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Uncomment below if you want to include custom images (e.g., splash screen logo)
  assets:
    - pics/logo.jpg
